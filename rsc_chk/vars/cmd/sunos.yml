sunos_combined_command: |
  echo "===os_info==="
  echo "os_name=`uname -s`"
  echo "os_version=`head -n 1 /etc/release | awk '{print $1, $2, $3, $4}'`"
  echo "kernel=SunOS `uname -r` `uname -v`"
  echo "os_type=Unix"

  echo "===df_lines==="
  df -k | awk 'NR==1 {print; next}
  NF<6 { getline nextline; $0=$0" "nextline }
  { print }'

  echo "===disk_size==="
  df -k | nawk '$1 ~ /^\/dev\// {s+=$2} END {print int(s/1024/1024)}'
  
  echo "===uptime==="
  uptime

  echo "===cpu==="
  mpstat 1 2 | tail -1 | awk '{print 100 - $NF}'

  echo "===cpu_cores==="
  result=`kstat -p cpu_info 2>/dev/null | nawk -F'[: \t]+' '
  $4=="chip_id" {chip[$2]=$5}
  $4=="core_id" {core[$2]=$5}
  $4=="ncore_per_chip" {ncore[$2]=$5}
  END {
    for (i in chip) {
      sockets[chip[i]]=1
      if (i in ncore && ncore[i] > 0) ncore_by_chip[chip[i]]=ncore[i]
      if (i in core) core_set[chip[i] "," core[i]]=1
    }

    for (s in sockets) cpu++

    for (s in ncore_by_chip) {
      sum += ncore_by_chip[s]
      ncore_chips++
    }

    if (ncore_chips > 0) {
      cores_per_cpu = sum / ncore_chips
    } else {
      for (c in core_set) total_cores++
      if (cpu > 0) cores_per_cpu = total_cores / cpu
    }

    if (cpu > 0 && cores_per_cpu > 0)
      printf "CPU: %d, Cores/CPU: %.0f\n", cpu, cores_per_cpu
  }'`

  if [ -n "$result" ]; then
    echo "$result"
  else
    psrinfo -pv | nawk '
    /physical processor has/ {
      cpu++
      if ($6 == "cores" || $6 == "core") cores += $5
      else if ($6 == "virtual" && ($7 == "processor" || $7 == "processors")) cores += $5
    }
    END {
      if (cpu > 0 && cores > 0)
        printf "CPU: %d, Cores/CPU: %.0f\n", cpu, cores / cpu
    }'
  fi

  echo "===memory==="
  vmstat 1 2 | tail -1 | awk '{print ($5/($4+$5))*100}'

  echo "===memory_size==="
  prtconf | awk '/Memory size/ {printf "%.0f\n", $3 * 1048576 / 1000000}'

  echo "===user_list==="
  awk -F: '$7 ~ /(sh|bash|ksh|pfksh)$/ {print $1}' /etc/passwd

  echo "===service_list==="
  if command -v svcs >/dev/null 2>&1; then
    svcs -a | awk 'NR > 1 { print $3 }' | while read svc; do
      state=`svcs -o state -H "$svc" 2>/dev/null`
      enabled=`svcs -l "$svc" 2>/dev/null | awk '/^enabled/ {print $NF}'`
      echo "{\"name\": \"$svc\", \"source\": \"smf\", \"state\": \"$state\", \"status\": \"$enabled\"}"
    done
  else
    ls /etc/init.d | while read svc; do
      echo "{\"name\": \"$svc\", \"source\": \"initd\", \"state\": \"unknown\"}"
    done
  fi

  echo "===package_list==="
  pkginfo | awk '{ print $2 }' | while read pkg; do 
    info=`pkginfo -l $pkg`
    version=`echo "$info" | grep 'VERSION' | cut -d':' -f2 | cut -d',' -f1 | sed 's/^ *//'`
    release=`echo "$info" | grep 'VERSION' | cut -d',' -f2 | cut -d'=' -f2`
    arch=`echo "$info" | grep 'ARCH' | cut -d':' -f2 | sed 's/^ *//'`
    echo "{\"name\": \"$pkg\", \"version\": \"$version\", \"release\": \"$release\", \"epoch\": null, \"arch\": \"$arch\", \"source\": \"pkginfo\"}"
  done