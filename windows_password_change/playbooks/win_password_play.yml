---
- name: change_password_play
  hosts: all
  strategy: free
  gather_facts: false
  tasks: 
    - name: 날짜 연+월
      run_once: true
      set_fact:
        fap_today: "{{ lookup('ansible.builtin.pipe','date +%Y%m')}}" # 연 월 합친 변수 생성
      delegate_to: localhost

    - name: 이전 계정 정보 저장
      set_fact:
        before_user: "{{ ansible_user }}"
        before_pass: "{{ ansible_password }}"
      
    - name: 실행 계정 추출
      fap.common.get_credential:
        credential_name: "{{ fap_today }}win"
        host_ip: "{{ fap.host_ip | default(omit) }}"
        host_name: "{{ fap.host_name | default(omit) }}"
      register: user_info
      delegate_to: localhost

    - name: 실행 계정 패스워드 패턴 추출
      set_fact:
        month_user: "{{ user_info.data.username }}"
        #month_pass: "{{ user_info.data.password | regex_replace('\\${3}', '%03d' % (fap.host_ip.split('.')[2] | int)) }}"
        month_pass: "{{ user_info.data.password }}"
        
    - name: 현재 패스워드 확인
      debug:
        msg: 
          - "현재 패스워드 : {{ ansible_password }}"

    - name: 변경 계정 출력
      debug:
        msg:
          - "{{ month_user }}"
          - "{{ month_pass }}"

    - name: 접속 확인
      win_ping:
      when: 
        - ansible_port == 5985
        - month_user == "Administrator"

    - name: Windows tasks
      include_tasks: ../tasks/windows_passwd_test.yml
      when: 
        - ansible_port == 5985
        - month_user == "Administrator"

- name: change_password_play
  hosts: all
  strategy: free
  gather_facts: false
  tasks: 
    - name: vars 호출
      include_vars: ../vars/passwd_vars.yml

    - name: 작업 실행자 조회
      delegate_to: "{{ localhost }}"
      run_once: true
      shell: |
        docker exec \
          -e PGPASSWORD={{ fap_db_password }} \
          -i pg-0 \
          psql \
          -U nds \
          -d fap \
          -t -A \
          -c "
          SELECT ui.user_name
          FROM job_info ji
          JOIN user_info ui
            ON ji.execute_by = ui.user_cd
          WHERE ji.job_id = {{ fap.job_id }};
          "
      register: execute_user
    
    - name: 작업 실행자 저장
      run_once: true
      set_fact:
        execute_user_name: "{{ execute_user.stdout | trim }}"

    - name: 날짜 연+월
      run_once: true
      set_fact:
        fap_today: "{{ lookup('ansible.builtin.pipe','date +%Y%m')}}" # 연 월 합친 변수 생성
      delegate_to: localhost

    - name: 현재 시간
      run_once: true
      set_fact:
        change_time: "{{ lookup('pipe', 'date +%H:%M:%S') }}"
      delegate_to: localhost

    - name: 새 패스워드로 접속 확인
      win_ping:
      vars:
        # ansible_user: "{{ hostvars[inventory_hostname].before_user }}"
        ansible_password: "{{ hostvars[inventory_hostname].month_pass }}"
      ignore_errors: true
      ignore_unreachable: true
      register: verify_result
      no_log: true
      when:
        - ansible_port | int == 5985
        - hostvars[inventory_hostname].month_user | default('') == "Administrator"
        - hostvars[inventory_hostname].month_pass is defined

    - name: 보고서 패스워드 변경 결과 정리
      set_fact:
        report_result_message: >-
          {% if verify_result.ping | default('') == 'pong' %}
          패스워드 변경이 완료되었습니다.
          {% elif hostvars[inventory_hostname].password_change_changed | default(false) %}
          패스워드는 변경된 것으로 보이나 새 패스워드 접속 확인이 필요합니다.
          {% else %}
          패스워드 변경 확인이 필요합니다.
          {% endif %}

    - debug:
        msg: "{{ report_result_message }}"

    - name: FAP Administrator password 변경
      fap.common.change_host_credential:
        host_ip: "{{ fap.host_ip }}"
        password: "{{ month_pass }}"
      delegate_to: localhost
      when: month_user == 'Administrator'

    - name: DB Save
      include_tasks: ../tasks/password_report_tasks.yml