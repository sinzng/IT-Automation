---
# 패스워드 변경 작업 직후 include해서 사용합니다.

- name: 보고서 패스워드 변경 출력값 설정
  set_fact:
    report_password_stdout: "{{ password_value.stdout | default('') if password_value is defined else '' }}"

- name: 보고서 패스워드 변경 flag값 정리
  set_fact:
    report_result_message: >-
      {{ '패스워드 변경이 완료되었습니다.' if ('패스워드 변경이 완료되었습니다.' in report_password_stdout)
      else '패스워드 변경 실패' if ('패스워드 변경 실패' in report_password_stdout)
      else '패스워드 변경 확인이 필요합니다.' if ('패스워드 변경 확인이 필요합니다.' in report_password_stdout)
      else '패스워드 변경 확인이 필요합니다.' }}

- name: 보고서 기본값 설정
  set_fact:
    report_inventory_name: "none"
    report_group_name: "none"
    report_host_ip: "{{ fap.host | default(ansible_host | default(inventory_hostname)) }}"
    report_host_name: "{{ fap.host_name | default('none') }}"
    report_change_date_value: "{{ report_change_date | default(ansible_date_time.date | default('')) }}"
    report_is_success: "{{ password_value is defined and (password_value.rc | default(1) | int == 0) and ('패스워드 변경이 완료되었습니다.' in report_password_stdout) }}"

- name: 보고서 인벤토리명 설정
  set_fact:
    report_inventory_name: "{{ fap.inventory_info[0].keys() | first }}"
  when:
    - fap.inventory_info is defined
    - fap.inventory_info | length > 0

- name: 보고서 OS 그룹명 설정
  set_fact:
    report_group_name: "{{ fap.group_info[0].keys() | first }}"
  when:
    - fap.group_info is defined
    - fap.group_info | length > 0

- name: 보고서 OS 그룹명 직접값 설정
  set_fact:
    report_group_name: "{{ fap.group_name }}"
  when: fap.group_name is defined

####################################################
# 1. Python 보고서 생성용 데이터
####################################################

- name: 보고서 생성용 데이터 생성
  set_fact:
    report_result_value: "{{ report_result_value | default([]) + [{
      'inventory': report_inventory_name,
      'host': report_host_ip,
      'host_name': report_host_name,
      'name': '패스워드 변경 결과',
      'command': 'passwd',
      'is_success': report_is_success,
      'is_pass': 'none',
      'report_type': report_name | default('changepwd'),
      'before_user': before_user | default('none'),
      'before_pass': before_pass | default(''),
      'system': month_user | default('none'),
      'system_pw': month_pass | default(''),
      'group': report_group_name,
      'change_date': report_change_date_value,
      'result_message': report_result_message | default(''),
      'result': report_result_message | default(''),
      'changed_by': execute_user_name | default('none'),
      'change_time': change_time | default(''),
    }] }}"

- name: Python 보고서 입력 데이터 전체 취합
  set_fact:
    report_data_list: >-
      {{
        ansible_play_hosts_all
        | default(ansible_play_hosts)
        | default([inventory_hostname])
        | map('extract', hostvars, 'report_result_value')
        | select('defined')
        | list
        | flatten
      }}
  run_once: true
  delegate_to: localhost

- name: Python 보고서 Content 생성
  set_fact:
    report_content_value:
      data_list: "{{ report_data_list }}"
      total_count: "{{ report_data_list | length }}"
  run_once: true
  delegate_to: localhost

- name: Python 입력 JSON 저장
  copy:
    dest: "{{ report_content_file | default('../vars/content_value.json') }}"
    content: "{{ report_content_value | to_nice_json }}"
    mode: "0644"
  run_once: true
  delegate_to: localhost

- name: 저장 폴더 생성
  file:
    path: "{{ save_path }}"
    state: directory
    mode: "0755"
    owner: fap
    group: fap
  run_once: true
  delegate_to: localhost

- name: 패스워드 변경 보고서 생성
  command:
    argv:
      - /usr/bin/python3
      - ../vars/passwd_report.py
      - "--input"
      - "{{ report_content_file | default('../vars/content_value.json') }}"
      - "--output"
      - "{{ save_path }}"
      - "--mask-passwords"
      - "{{ report_mask_passwords | default(false) | string | lower }}"
  run_once: true
  register: python_result
  delegate_to: localhost

# - name: Python 실행 결과 확인
#   debug:
#     var: python_result
#   run_once: true
#   delegate_to: localhost

####################################################
# 2. DB 저장 (보고서 1건)
####################################################

- name: 결과 파일 DB화 작업
  set_fact:
    db_result_value: "{{ db_result_value | default([]) + [{
      'host': inventory_hostname,
      'host_name': fap.host_ip,
      'is_success': true,
      'file_path': save_path,
      'report_type': report_name,
      'system': report_group_name
    }] }}"
  delegate_to: localhost

- name: Make content value
  set_fact:
    content_value: "{{ content_value | default({}) | combine({'data_list': db_result_value}) }}"
  delegate_to: localhost

- name: Save DB
  fap.common.save_data:
    content: "{{ content_value }}"
    protocol: http
    hostname: "{{ inventory_hostname }}"
    data_type: report
    data_key: change_password
    template_id: "{{ fap.template_id | default(omit) }}"
    job_id: "{{ fap.job_id | default(omit) }}"
  delegate_to: localhost